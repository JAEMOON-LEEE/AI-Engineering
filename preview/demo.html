  /* 발표 PPT와 같은 톤: 연보라 배경 + 레트로 창 프레임 + 굵은 테두리 박스 */
  :root {
    --page:#dcdff8; --win:#f4f5f8; --bar:#8fabf5; --ink:#2f3138; --muted:#6b6e78; --line:#2f3138;
    --lav:#dcdff8; --peri:#8fabf5; --peri-d:#5876e0; --yellow:#fff3a3; --pink:#f8bad3; --gray:#e4e5ea; --white:#fff;
    --head:"Black Han Sans","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    --body:"Gothic A1","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--page); color:var(--ink); font:16px/1.5 var(--body); }
  .window { max-width:1320px; margin:24px auto; border:3px solid var(--line); background:var(--win); min-height:calc(100vh - 48px); }
  .titlebar { height:54px; background:var(--bar); border-bottom:3px solid var(--line); display:flex; justify-content:flex-end; align-items:center; padding:0 22px; gap:8px; }
  .titlebar svg { width:30px; height:30px; }
  .wrap { padding:22px 44px 32px; }
  header { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-bottom:22px; }
  .ttl { display:flex; align-items:center; gap:16px; }
  .num { width:52px; height:52px; border:2.5px solid var(--line); border-radius:50%; background:var(--lav);
    display:grid; place-items:center; font:700 22px var(--body); }
  h1 { margin:0; font:400 46px/1 var(--head); letter-spacing:-.01em; }
  .subt { margin:6px 0 0 68px; color:var(--muted); font-size:17px; }
  .chip { font-size:13px; font-weight:700; border:2px solid var(--line); background:var(--white); padding:4px 10px; }
  .chip.warn { background:var(--pink); }
  .btn { display:inline-block; border:2.5px solid var(--line); background:var(--white); color:var(--ink);
    padding:10px 20px; font:700 15px var(--body); cursor:pointer; }
  .btn:hover { background:var(--lav); }
  .btn.primary { background:var(--peri); }
  .btn.primary:hover { background:var(--peri-d); color:#fff; }
  .link { background:none; border:0; color:var(--muted); font:600 14px var(--body); cursor:pointer; text-decoration:underline; padding:4px; }

  #empty { min-height:56vh; display:grid; place-items:center; }
  .drop { width:min(620px,100%); background:var(--white); border:3px dashed var(--line); padding:52px 28px; text-align:center; }
  .drop.over { background:var(--lav); border-style:solid; }
  .drop svg { width:52px; height:52px; }
  .drop h2 { margin:16px 0 6px; font:400 30px var(--head); }
  .drop p { margin:0 0 22px; color:var(--muted); }
  .drop .link { margin-top:12px; }
  .err { color:#c0392b; font-weight:600; font-size:14px; margin-top:12px; min-height:1em; }

  #busy { min-height:56vh; display:none; place-items:center; text-align:center; font-weight:700; }
  .spin { width:40px; height:40px; border:4px solid var(--lav); border-top-color:var(--ink); border-radius:50%;
    animation:r .8s linear infinite; margin:0 auto 14px; }
  @keyframes r { to { transform:rotate(360deg); } }

  #result { display:none; }
  .bar { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .bar .meta { font-weight:600; color:var(--muted); }
  .filters { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
  .f { border:2.5px solid var(--line); padding:7px 14px; font:700 15px var(--body); cursor:pointer;
    display:flex; gap:8px; align-items:center; color:var(--ink); background:var(--white); }
  .f b { font-variant-numeric:tabular-nums; }
  .f.on { outline:3px solid var(--ink); outline-offset:2px; }
  .dot { width:14px; height:14px; border:2px solid var(--line); }
  .grid { display:grid; grid-template-columns:330px 1fr; gap:20px; align-items:start; }
  .grid > * { min-width:0; }
  .list { display:flex; flex-direction:column; gap:6px; }
  .card { display:grid; grid-template-columns:1fr auto; align-items:center; gap:4px 10px; width:100%; text-align:left;
    background:var(--white); border:2.5px solid var(--line); padding:7px 12px 6px; cursor:pointer; font:inherit; color:inherit; }
  .card.on { background:var(--lav); box-shadow:5px 5px 0 var(--line); transform:translate(-2px,-2px); }
  .card .nm { font-weight:800; font-size:16px; }
  .card .nm small { color:var(--muted); font-weight:600; margin-left:6px; }
  .card svg { grid-column:1 / -1; width:100%; height:18px; }
  .tag { font-size:13px; font-weight:800; padding:2px 8px; border:2px solid var(--line); white-space:nowrap; }
  .hot { background:var(--yellow); } .high { background:var(--peri); } .mid { background:var(--lav); }
  .warn { background:var(--pink); } .low { background:var(--gray); }

  .panel { background:var(--white); border:2.5px solid var(--line); padding:22px 24px; }
  .who { display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .who h2 { margin:0; font:400 34px var(--head); }
  .who span { color:var(--muted); font-weight:600; }
  .act { border:3px solid var(--line); padding:16px 20px; margin:16px 0 20px; display:flex; justify-content:space-between; align-items:center; gap:16px; }
  .act .k { font-size:14px; font-weight:800; }
  .act .t { font:400 30px/1.15 var(--head); }
  .act .s { font-size:14px; font-weight:600; }
  .big { text-align:right; flex-shrink:0; }
  .big b { display:block; font:400 52px/1 var(--head); font-variant-numeric:tabular-nums; }
  .big span { font-size:13px; font-weight:700; }
  .sec { font-size:15px; font-weight:800; margin-bottom:4px; }
  svg text { fill:var(--muted); font:600 12px var(--body); }
  .visits { display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; }
  .v { flex:1 1 120px; background:var(--lav); border:2px solid var(--line); padding:10px 12px; font-size:13px; font-weight:600; }
  .v b { font:400 26px/1.2 var(--head); display:block; }
  .sig { display:flex; gap:4px; flex-wrap:wrap; margin-top:6px; }
  .sig i { font-style:normal; font-size:12px; font-weight:800; padding:1px 6px; border:1.5px solid var(--line); background:var(--white); }
  .s-on { background:var(--yellow) !important; } .s-warn { background:var(--pink) !important; }

  .ok { color:#1e7a4c; } .bad { color:#c0392b; }
  @media (max-width:900px) { .grid { grid-template-columns:1fr; } .wrap { padding:20px 16px 28px; } .window { margin:12px; }
    h1 { font-size:34px; } .subt { margin-left:0; } }

// ---------- 모델 계산 (export_model.py와 같은 전처리) ----------
// 세션 1건: drop_first=False 원핫 → 학습 열 목록으로 reindex(없는 열 0) → 표준화 → Dense 층 순서대로
function toFeatures(row, M) {
  return M.columns.map(col => {
    for (const cat of M.categorical)
      if (col.startsWith(cat + "_")) return String(row[cat]) === col.slice(cat.length + 1) ? 1 : 0;
    let v = row[col];
    if (v === true || /^true$/i.test(v)) return 1;
    if (v === false || /^false$/i.test(v)) return 0;
    if (v === undefined || v === "") throw new Error(`'${col}' 컬럼이 없습니다`);
    v = Number(v);
    if (!Number.isFinite(v)) throw new Error(`'${col}' 값이 숫자가 아닙니다`);
    return v;
  });
}
function predict(row, M) {
  let h = toFeatures(row, M).map((x, i) => (x - M.scaler_mean[i]) / M.scaler_scale[i]);
  for (const L of M.layers) {
    const out = L.b.slice();
    for (let i = 0; i < h.length; i++) { const hi = h[i], Wi = L.W[i]; for (let j = 0; j < out.length; j++) out[j] += hi * Wi[j]; }
    h = L.activation === "relu" ? out.map(z => Math.max(0, z))
      : L.activation === "sigmoid" ? out.map(z => 1 / (1 + Math.exp(-z))) : out;
  }
  return h[0];
}

// ---------- 추천 규칙 (모델 밖, 우리가 정한 활용 규칙) ----------
const LOW = 0.30, TREND = 0.15;
const GROUPS = [
  { tag:"구매 임박", cls:"hot", title:"장바구니 리마인드",  sub:"할인 없이 리마인드만" },
  { tag:"구매 유력", cls:"high", title:"할인 없이 상품 추천", sub:"쿠폰 비용 절약" },
  { tag:"망설임",    cls:"mid",  title:"쿠폰 · 프로모션",     sub:"마지막 한 걸음 유도" },
  { tag:"이탈 위험", cls:"warn", title:"이탈 방지 쿠폰",      sub:"식은 관심 되살리기" },
  { tag:"관심 낮음", cls:"low",  title:"광고 노출 줄이기",    sub:"마케팅 비용 절감" },
];
function decide(probs, T) {
  const last = probs[probs.length - 1], first = probs[0], peak = Math.max(...probs);
  const trend = last - first;
  const dir = trend >= TREND ? "상승" : trend <= -TREND ? "하락" : "유지";
  const g = (dir === "하락" && peak >= T && last < T) ? GROUPS[3]
          : (last >= T && dir === "상승") ? GROUPS[0]
          : last >= T ? GROUPS[1]
          : last >= LOW ? GROUPS[2] : GROUPS[4];
  return { ...g, dir, trend, last };
}

let M = MODEL, rows = [], customers = [], sel = null, filt = null, source = "";
const $ = id => document.getElementById(id);
const fmt = p => p.toFixed(2);
const show = s => { ["empty", "busy", "result"].forEach(k => $(k).style.display = k === s ? (k === "result" ? "block" : "grid") : "none");
  $("btnReset").hidden = s !== "result"; };

function parseCSV(text) {
  const lines = text.replace(/^﻿/, "").trim().split(/\r?\n/);
  const head = lines[0].split(",").map(s => s.trim());
  return lines.slice(1).filter(l => l.trim()).map(l => {
    const c = l.split(","); const o = {}; head.forEach((h, i) => o[h] = (c[i] ?? "").trim()); return o;
  });
}

function load(data, name) {
  $("err").textContent = "";
  try {
    if (!data.length) throw new Error("데이터가 비어 있습니다");
    const by = new Map();
    data.forEach((r, i) => {
      r.__p = predict(r, M);
      const id = r.customer_id || `S${String(i + 1).padStart(3, "0")}`;
      if (!by.has(id)) by.set(id, { id, name: r.customer_name || "", visits: [] });
      by.get(id).visits.push(r);
    });
    rows = data; source = name;
    customers = [...by.values()].map(c => {
      c.visits.sort((a, b) => (+a.visit_no || 0) - (+b.visit_no || 0));
      c.probs = c.visits.map(v => v.__p);
      c.d = decide(c.probs, M.threshold);
      return c;
    });
    sel = customers[0].id; filt = null;
    $("busyText").textContent = `방문 ${rows.length}건 구매 확률 예측 중…`;
    show("busy");
    setTimeout(() => { show("result"); render(); }, 700);
  } catch (e) { show("empty"); $("err").textContent = "데이터를 읽지 못했습니다: " + e.message; }
}

function spark(ps, cls) {
  const W = 260, H = 26, n = ps.length, x = i => n === 1 ? W / 2 : 4 + i * (W - 8) / (n - 1), y = p => 3 + (1 - p) * (H - 6);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <line x1="0" x2="${W}" y1="${y(M.threshold)}" y2="${y(M.threshold)}" stroke="#9a9caa" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>
    <polyline fill="none" stroke="var(--peri-d)" stroke-width="2.5" vector-effect="non-scaling-stroke"
      points="${ps.map((p, i) => `${x(i)},${y(p)}`).join(" ")}"/></svg>`;
}

function chart(ps) {
  const W = 560, H = 190, L = 30, R = 70, T = 22, B = 14, n = ps.length;
  const x0 = L + 24, x1 = W - R - 16;
  const x = i => n === 1 ? (x0 + x1) / 2 : x0 + i * (x1 - x0) / (n - 1);
  const y = p => T + (1 - p) * (H - T - B);
  const th = M.threshold;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="방문별 구매 확률 그래프">`;
  [0, .5, 1].forEach(g => s += `<line x1="${L}" x2="${W - R}" y1="${y(g)}" y2="${y(g)}" stroke="#d5d7e3"/><text x="${L - 6}" y="${y(g) + 4}" text-anchor="end">${g}</text>`);
  s += `<line x1="${L}" x2="${W - R}" y1="${y(th)}" y2="${y(th)}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="6 5"/>
        <text x="${W - R + 8}" y="${y(th) + 4}" style="fill:var(--ink);font-weight:800">기준 ${(+th).toFixed(2)}</text>`;
  s += `<polyline fill="none" stroke="var(--peri-d)" stroke-width="3.5" points="${ps.map((p, i) => `${x(i)},${y(p)}`).join(" ")}"/>`;
  ps.forEach((p, i) => s += `<circle cx="${x(i)}" cy="${y(p)}" r="7" fill="var(--peri)" stroke="var(--ink)" stroke-width="2.5"/>
    <text x="${x(i)}" y="${y(p) - 11}" text-anchor="middle" style="fill:var(--ink);font:400 18px var(--head)">${fmt(p)}</text>`);
  return s + "</svg>";
}

function render() {
  $("filters").innerHTML = `<button class="f ${filt === null ? "on" : ""}" data-f="">전체 <b>${customers.length}</b></button>` +
    GROUPS.map(g => `<button class="f ${filt === g.tag ? "on" : ""}" data-f="${g.tag}"><span class="dot ${g.cls}"></span>${g.tag} <b>${customers.filter(c => c.d.tag === g.tag).length}</b></button>`).join("");
  document.querySelectorAll(".f").forEach(b => b.onclick = () => {
    filt = b.dataset.f || null;
    const vis = customers.filter(c => !filt || c.d.tag === filt);
    if (vis.length && !vis.find(c => c.id === sel)) sel = vis[0].id;
    render();
  });

  const vis = customers.filter(c => !filt || c.d.tag === filt);
  $("list").innerHTML = vis.map((c, i) => `
    <button class="card ${c.id === sel ? "on" : ""}" data-id="${c.id}" style="animation-delay:${i * 40}ms">
      <span class="nm">${c.name || c.id}<small>${c.name ? c.id : ""}</small></span>
      <span class="tag ${c.d.cls}">${c.d.tag}</span>
      ${spark(c.probs, c.d.cls)}
    </button>`).join("");
  document.querySelectorAll(".card").forEach(b => b.onclick = () => { sel = b.dataset.id; render(); });

  const c = vis.find(x => x.id === sel);
  $("detail").innerHTML = !c ? "" : `
    <div class="panel">
      <div class="who"><h2>${c.name || c.id}</h2></div>
      <div class="act ${c.d.cls}">
        <div><div class="k">추천</div><div class="t">${c.d.title}</div><div class="s">${c.d.sub}</div></div>
        <div class="big"><b>${fmt(c.d.last)}</b><span>최근 방문 구매 확률</span></div>
      </div>
      <div class="sec">모델 예측 · 방문별 구매 확률</div>
      ${chart(c.probs)}
      <div class="visits">${c.visits.map((v, i) => `
        <div class="v"><span>${v.visit_no || i + 1}회${v.visit_date ? " · " + v.visit_date.slice(5) : ""}</span><b>${fmt(v.__p)}</b>
          <div class="sig"><i class="${+v.PageValues > 0 ? "s-on" : "s-off"}">PageValues ${(+v.PageValues).toFixed(0)}</i>${
            +v.ExitRates >= 0.05 ? `<i class="s-warn">금방 나감</i>` : ""}</div></div>`).join("")}</div>
    </div>`;

}

function checkModel() {}

// ---------- 입력 ----------
const readFile = async f => load(parseCSV(await f.text()), f.name);
$("fileCsv").onchange = e => { const f = e.target.files[0]; if (f) readFile(f); e.target.value = ""; };
$("btnMock").onclick = () => load(MOCK.map(r => ({ ...r })), "예시 데이터");
$("btnReset").onclick = () => { $("err").textContent = ""; show("empty"); };
const drop = $("drop");
let depth = 0;
document.addEventListener("dragenter", e => { e.preventDefault(); depth++; drop.classList.add("over"); });
document.addEventListener("dragleave", e => { e.preventDefault(); if (--depth <= 0) { depth = 0; drop.classList.remove("over"); } });
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => { e.preventDefault(); depth = 0; drop.classList.remove("over");
  const f = e.dataTransfer.files[0]; if (f) readFile(f); });

checkModel();
show("empty");
</script>
